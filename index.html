<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="theme-color" content="#064486">
<title>أبو أمجد للاستشارات والتصاميم الهندسية</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#fff}
.page{position:relative;width:100%;max-width:1536px;margin:0 auto;line-height:0}
.page-image{display:block;width:100%;height:auto;margin:0;padding:0;user-select:none;-webkit-user-drag:none}
.overlay-form{position:absolute;inset:0;margin:0;pointer-events:none}.hotspot{position:absolute;pointer-events:auto;display:block;border:0;background:transparent;cursor:pointer;padding:0;line-height:normal;z-index:2;border-radius:5px}
.hotspot:focus-visible{outline:3px solid #ffbf36;background:#ffffff25}
.hotspot:hover{background:rgba(255,255,255,.07)}
.field-zone{z-index:4}
.hotfield{width:100%;height:100%;border:1px solid transparent;border-radius:6px;background:rgba(255,255,255,.01);color:#26364b;padding:8px 10px;outline:none;font-size:clamp(8px,1vw,14px);text-align:right;line-height:1.4}
.hotfield::placeholder{color:transparent}
.hotfield:focus{background:rgba(255,255,255,.97);border-color:#2878c7;box-shadow:0 0 0 2px #2878c733}
select.hotfield{cursor:pointer;color:transparent}
select.hotfield:focus,select.hotfield:valid{color:#26364b}
.field-zone:focus-within{z-index:8}
.field-zone:focus-within .hotfield{background:rgba(255,255,255,.98)}

textarea.hotfield{resize:none}
.hot-submit{width:100%;height:100%;border:0;border-radius:7px;background:transparent;cursor:pointer}
.hot-submit:hover{background:#ffffff20}
.modal-bg{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,20,48,.68);align-items:center;justify-content:center;padding:18px;line-height:1.7}
.modal-bg.open{display:flex}
.modal{width:min(500px,100%);max-height:85vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 20px 60px #0005;color:#27364a}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#f3f7fc;border-bottom:1px solid #e1e8f0}
.modal-head h2{font-size:19px;color:#064486;margin:0}
.close{border:0;border-radius:8px;width:34px;height:34px;font-size:24px;cursor:pointer;color:#064486;background:#e3edf8}
.modal-body{padding:20px;font-size:15px;line-height:1.9}
.modal-body p{margin:0 0 12px}
.modal-body input,.modal-body textarea{width:100%;padding:11px;border:1px solid #cbd7e5;border-radius:7px;margin:0 0 10px;font:inherit;line-height:1.5}
.action{border:0;border-radius:8px;background:#064486;color:#fff;font-weight:bold;padding:11px 18px;cursor:pointer}
.action.secondary{background:#edf3fb;color:#064486;border:1px solid #cbd7e5}
@media(max-width:600px){
  .hotfield{font-size:clamp(10px,2.8vw,14px);padding:3px}
  .modal-bg{padding:12px}
  .modal{width:100%;max-height:90dvh;border-radius:12px}
  .modal-head{padding:12px 14px}
  .modal-head h2{font-size:18px}
  .modal-body{font-size:14px;padding:15px}
  .action{min-height:44px}
}
@media(min-width:601px){
  .modal{width:min(560px,calc(100vw - 40px))}
  .modal-body{font-size:16px}
}
@media(hover:none){
  .hotspot:hover{background:transparent}
  .hotspot:active{background:rgba(255,255,255,.16)}
}


/* Dynamic navigation over the original screenshot's menu area */
.menu-redraw{position:absolute;left:17.5%;top:4.5%;width:62.5%;height:10.5%;z-index:5;background:#fff;display:flex;align-items:center;justify-content:center;gap:clamp(5px,1.7vw,27px);padding:4px 8px;line-height:1.2;overflow:hidden}
.menu-redraw button{border:0;background:transparent;color:#263747;font-family:Tahoma,Arial,sans-serif;font-weight:bold;font-size:clamp(7px,.95vw,14px);height:100%;padding:0 3px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
.menu-redraw button:hover,.menu-redraw button.active{color:#064486;border-bottom-color:#064486}
.logo-admin-trigger{position:absolute;left:80%;top:.5%;width:19%;height:17%;z-index:7;border:0;background:transparent;cursor:pointer;border-radius:8px}
.logo-admin-trigger:focus-visible{outline:3px solid #ffbf36}
.properties-section{direction:rtl;padding:34px 4% 42px;background:#fff;color:#263747;line-height:1.7}
.properties-head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:22px}
.properties-head h2{font-size:27px;color:#064486;margin:0;border-bottom:2px solid #064486;padding-bottom:8px}
.properties-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.property-card{border:1px solid #e2e9f1;border-radius:13px;overflow:hidden;background:#fff;box-shadow:0 5px 20px #092b4a10;cursor:pointer;transition:.2s}
.property-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #092b4a18}
.property-card img{width:100%;height:210px;object-fit:cover;display:block;background:#edf2f8}
.property-info{padding:15px}.property-info h3{margin:0 0 7px;color:#064486;font-size:19px}.property-info p{margin:0 0 9px;font-size:14px;line-height:1.8;white-space:pre-wrap}.property-price{font-weight:bold;color:#0757b5}
.no-properties{padding:28px;border:1px dashed #b9c9dc;border-radius:12px;text-align:center;color:#6c7888;background:#f7f9fc}
.admin-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.admin-tabs button{border:1px solid #d1deed;background:#f3f7fc;color:#064486;border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:bold}
.admin-tabs button.active{background:#064486;color:white}
.admin-form{display:grid;gap:10px}
.admin-form input,.admin-form textarea,.admin-form select{width:100%;border:1px solid #cbd7e5;border-radius:8px;padding:11px;font:inherit;line-height:1.5;background:white;color:#263747}
.admin-form textarea{min-height:85px;resize:vertical}
.admin-list{display:grid;gap:8px;margin-top:14px}
.admin-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #e1e8f0;border-radius:8px;padding:10px}
.admin-row span{overflow-wrap:anywhere}
.admin-row button{border:0;border-radius:7px;padding:7px 10px;background:#fff0f0;color:#a12323;cursor:pointer}
.admin-note{font-size:12px;color:#6b7684;line-height:1.8;margin:12px 0 0}
.action.danger{background:#a12323}
@media(max-width:700px){
 .menu-redraw{left:17.5%;top:4.5%;width:62.5%;height:10.5%;gap:3px;padding:2px}
 .menu-redraw button{font-size:clamp(6px,1.45vw,10px);padding:0 1px;border-bottom-width:2px}
 .properties-section{padding:25px 4% 32px}
 .properties-head h2{font-size:23px}
 .properties-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .property-card img{height:145px}
 .property-info{padding:10px}
 .property-info h3{font-size:16px}
 .property-info p{font-size:12px}
}
@media(max-width:420px){.properties-grid{grid-template-columns:1fr}.property-card img{height:205px}}


/* Modern, readable consultation form */
.field-zone{z-index:6;overflow:visible}
.hotfield{
 width:100%;height:100%;
 border:1px solid #d5e2f0;
 border-radius:8px;
 background:rgba(255,255,255,.98);
 color:#173451;
 padding:7px 10px;
 outline:none;
 font-family:Tahoma,Arial,sans-serif;
 font-size:clamp(10px,1.05vw,15px);
 font-weight:500;
 text-align:right;
 line-height:1.5;
 box-shadow:0 2px 7px rgba(0,25,60,.12);
 direction:rtl;
}
.hotfield::placeholder{color:#7b8999;opacity:1}
.hotfield:focus{
 background:#fff;
 border-color:#0874d1;
 box-shadow:0 0 0 2px rgba(8,116,209,.18),0 4px 12px rgba(0,25,60,.16);
}
select.hotfield{color:#667789;cursor:pointer}
select.hotfield:valid{color:#173451}
textarea.hotfield{resize:none;vertical-align:top;padding-top:9px;overflow:auto}
.field-zone:focus-within{z-index:12}
.field-zone:focus-within .hotfield{background:#fff}
.field-zone:has(.hot-submit){overflow:visible}
.hot-submit{
 width:100%;height:100%;
 border:0;border-radius:8px;
 background:linear-gradient(135deg,#0875d1,#064486);
 box-shadow:0 3px 9px rgba(0,40,90,.25);
 cursor:pointer;
 transition:transform .15s ease,filter .15s ease;
}
.hot-submit::after{content:"أرسل طلبك الآن  ✈";display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:#fff;font-family:Tahoma,Arial,sans-serif;font-size:clamp(10px,1.05vw,15px);font-weight:700;line-height:1.2;white-space:nowrap}
.hot-submit:hover{filter:brightness(1.08);transform:translateY(-1px)}
.hot-submit:active{transform:scale(.98)}
@media(max-width:700px){
 .hotfield{font-size:clamp(11px,1.7vw,14px);padding:4px 7px;border-radius:7px}
 .hotfield::placeholder{color:#687b8e;opacity:1}
 .hot-submit::after{font-size:clamp(9px,1.55vw,13px)}
 textarea.hotfield{padding-top:6px}
}
@media(max-width:380px){
 .hotfield{font-size:10px;padding:3px 5px}
 .hot-submit::after{font-size:9px}
}


/* Clean consultation panel for mobile instead of cramped fields over the image */
.consult-mobile-card{display:none}
@media(max-width:700px){
 .field-zone{display:none!important}
 .hot-submit{display:none!important}
 .consult-mobile-card{
   display:flex;position:absolute;z-index:9;left:3.2%;top:55.2%;width:22.3%;height:37.5%;
   padding:clamp(5px,1.2vw,10px);flex-direction:column;align-items:center;justify-content:center;
   gap:clamp(3px,.8vw,8px);overflow:hidden;text-align:center;direction:rtl;color:#fff;
   background:linear-gradient(155deg,#0b5599 0%,#063568 100%);
   border:1px solid rgba(255,255,255,.25);border-radius:clamp(7px,1.4vw,14px);
   box-shadow:0 5px 16px rgba(0,25,60,.28);line-height:1.4;
 }
 .consult-card-icon{display:flex;align-items:center;justify-content:center;width:clamp(18px,4vw,34px);height:clamp(18px,4vw,34px);border-radius:50%;background:#ffffff20;color:#fff;font-size:clamp(12px,2.4vw,20px)}
 .consult-mobile-card h2{font-size:clamp(8px,1.9vw,15px);line-height:1.35;margin:0;color:#fff;font-weight:800}
 .consult-mobile-card p{font-size:clamp(6px,1.25vw,10px);line-height:1.5;margin:0;color:#eaf4ff}
 .consult-open-btn{width:100%;min-height:clamp(22px,4.2vw,38px);padding:3px 2px;border:0;border-radius:6px;background:linear-gradient(135deg,#1684e5,#0752a0);color:white;font-family:Tahoma,Arial,sans-serif;font-size:clamp(6px,1.25vw,10px);font-weight:bold;line-height:1.3;box-shadow:0 2px 6px #001b3d50;cursor:pointer}
}
@media(max-width:380px){
 .consult-mobile-card{left:3.2%;top:55.2%;width:22.3%;height:37.5%;padding:4px;gap:3px}
 .consult-mobile-card p{font-size:6px}.consult-mobile-card h2{font-size:8px}.consult-open-btn{font-size:6px;min-height:21px}
}
.consult-dialog-form{display:grid;gap:12px}
.consult-dialog-form label{display:grid;gap:5px;color:#28415b;font-size:13px;font-weight:bold}
.consult-dialog-form input,.consult-dialog-form select,.consult-dialog-form textarea{width:100%;min-height:45px;padding:11px 12px;border:1px solid #cbd8e8;border-radius:9px;background:#fff;color:#18334d;font:15px Tahoma,Arial,sans-serif;direction:rtl;outline:none}
.consult-dialog-form textarea{min-height:105px;resize:vertical}
.consult-dialog-form input:focus,.consult-dialog-form select:focus,.consult-dialog-form textarea:focus{border-color:#0874d1;box-shadow:0 0 0 3px #0874d120}
.consult-dialog-form .action{min-height:47px;font-size:15px}

</style>
</head>

0.0%;width:17.0%;height:15.8%" data-title="تصاميم الفلل السكنية" data-desc="نماذج لتصاميم الفلل والمنازل." aria-label="تصاميم الفلل السكنية"></button>

<script>
const modalBg=document.getElementById('modalBg'),modalTitle=document.getElementById('modalTitle'),modalBody=document.getElementById('modalBody');
const adminBg=document.getElementById('adminBg'),adminTitle=document.getElementById('adminTitle'),adminBody=document.getElementById('adminBody');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function openModal(title,desc){modalTitle.textContent=title;modalBody.innerHTML='<p>'+esc(desc)+'</p><p>لطلب هذه الخدمة، يمكنك تعبئة نموذج الاستشارة الظاهر في الصفحة.</p><button class="action" id="goConsult">طلب استشارة</button>';modalBg.classList.add('open');document.body.style.overflow='hidden';document.getElementById('goConsult').onclick=()=>{closeModal();document.querySelector('input[name="name"]').focus({preventScroll:true});document.querySelector('input[name="name"]').scrollIntoView({behavior:'smooth',block:'center'})}}
function closeModal(){modalBg.classList.remove('open');document.body.style.overflow=''}
function closeAdmin(){adminBg.classList.remove('open');document.body.style.overflow=''}
document.querySelectorAll('button.hotspot[data-title]').forEach(b=>b.addEventListener('click',()=>openModal(b.dataset.title,b.dataset.desc)));
document.getElementById('closeModal').onclick=closeModal;
modalBg.addEventListener('click',e=>{if(e.target===modalBg)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeAdmin()}});

function openConsultationDialog(){
 modalTitle.textContent='طلب استشارة هندسية';
 modalBody.innerHTML=`<p style="color:#586b80;margin-bottom:14px">عبّئ البيانات التالية وسنتواصل معك بخصوص طلبك.</p>
 <form id="consultDialogForm" class="consult-dialog-form">
  <label>الاسم الكامل<input name="name" autocomplete="name" placeholder="اكتب اسمك الكامل" required></label>
  <label>رقم الجوال<input name="phone" type="tel" autocomplete="tel" placeholder="أدخل رقم الجوال" required></label>
  <label>الخدمة المطلوبة<select name="service" required><option value="">اختر الخدمة المطلوبة</option><option>التصميم المعماري</option><option>التصميم الإنشائي</option><option>التصميمات الصحية</option><option>التصميمات الكهربائية</option><option>التصميمات الميكانيكية</option><option>الإشراف الهندسي</option><option>رفع مساحي ومخططات</option><option>تقدير تكاليف</option><option>أخرى</option></select></label>
  <label>تفاصيل الطلب<textarea name="details" placeholder="اكتب تفاصيل المشروع أو الاستفسار..." required></textarea></label>
  <button class="action" type="submit">إرسال الطلب عبر واتساب</button>
 </form>`;
 modalBg.classList.add('open');document.body.style.overflow='hidden';
 const form=document.getElementById('consultDialogForm');
 form.addEventListener('submit',e=>{
  e.preventDefault();
  const d=new FormData(form);
  const request={id:Date.now(),date:new Date().toLocaleString('ar-YE'),name:String(d.get('name')||'').trim(),phone:String(d.get('phone')||'').trim(),service:String(d.get('service')||'').trim(),details:String(d.get('details')||'').trim(),status:'جديد'};
  const saved=getStore('abu_consultation_requests',[]);saved.unshift(request);setStore('abu_consultation_requests',saved);
  const msg=`طلب استشارة هندسية\nالاسم: ${request.name}\nرقم الجوال: ${request.phone}\nالخدمة: ${request.service}\nالتفاصيل: ${request.details}\nتاريخ الطلب: ${request.date}`;
  modalTitle.textContent='تم تجهيز طلبك';
  modalBody.innerHTML='<p>تم حفظ الطلب على هذا الجهاز. اضغط أدناه لإرساله إلى المكتب عبر واتساب.</p><button class="action" id="sendRequestWhatsApp">إرسال الطلب إلى واتساب</button>';
  document.getElementById('sendRequestWhatsApp').onclick=()=>window.open('https://wa.me/967735665047?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer');
 });
}
const openConsultationBtn=document.getElementById('openConsultation');
if(openConsultationBtn)openConsultationBtn.addEventListener('click',openConsultationDialog);
const requestForm=document.createElement('form');requestForm.id='requestForm';requestForm.style.cssText='position:absolute;width:0;height:0;overflow:hidden;pointer-events:none';document.querySelector('.page').appendChild(requestForm);
document.querySelectorAll('.field-zone input,.field-zone select,.field-zone textarea').forEach(el=>el.setAttribute('form','requestForm'));
const submitButton=document.querySelector('.hot-submit');
if(submitButton){submitButton.type='button';submitButton.removeAttribute('form');submitButton.addEventListener('click',openConsultationDialog)}


const DEFAULT_USERS=[{username:'salem',password:'ss1234560'}];
const DEFAULT_MENU=[
 {label:'الرئيسية',target:'home'}, {label:'عن المكتب',target:'about'}, {label:'خدماتنا',target:'services'},
 {label:'أعمالنا',target:'works'}, {label:'الاستشارات',target:'consult'}, {label:'تواصل معنا',target:'contact'}
];
const getStore=(key,def)=>{try{const v=JSON.parse(localStorage.getItem(key));return v??def}catch{return def}};
const setStore=(key,val)=>localStorage.setItem(key,JSON.stringify(val));
let users=getStore('abu_admin_users',DEFAULT_USERS), menuItems=getStore('abu_menu_items',DEFAULT_MENU), properties=getStore('abu_properties',[]), consultationRequests=getStore('abu_consultation_requests',[]);
let logoClicks=0,logoTimer=null,loggedIn=false,activeTab='properties';
document.getElementById('logoAdminTrigger').addEventListener('click',()=>{
 logoClicks++;clearTimeout(logoTimer);logoTimer=setTimeout(()=>logoClicks=0,2500);
 if(logoClicks>=5){logoClicks=0;showLogin()}
});
function showLogin(){adminTitle.textContent='دخول لوحة التحكم';adminBody.innerHTML=`<form id="loginForm" class="admin-form"><p>أدخل اسم المستخدم وكلمة المرور للدخول إلى لوحة التحكم.</p><input name="username" autocomplete="username" placeholder="اسم المستخدم" required><input name="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" required><button class="action">دخول</button><p id="loginError" style="color:#b42323;margin:0"></p></form>`;adminBg.classList.add('open');document.body.style.overflow='hidden';document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.currentTarget);users=getStore('abu_admin_users',DEFAULT_USERS);if(users.some(u=>u.username===d.get('username')&&u.password===d.get('password'))){loggedIn=true;renderAdmin('properties')}else document.getElementById('loginError').textContent='اسم المستخدم أو كلمة المرور غير صحيحة.'})}
document.getElementById('adminClose').onclick=closeAdmin;adminBg.addEventListener('click',e=>{if(e.target===adminBg)closeAdmin()});
function renderMenu(){
 const holder=document.getElementById('dynamicMenu');holder.innerHTML='';
 let propertiesAdded=false,locationAdded=false;
 const addLocationButton=()=>{
   if(locationAdded)return;locationAdded=true;
   const b=document.createElement('button');b.type='button';b.textContent='موقعنا';b.title='افتح موقع المكتب على خرائط Google';
   b.onclick=()=>window.open('https://maps.app.goo.gl/U7aFw2LHo1rmVyZC9?g_st=aw','_blank','noopener,noreferrer');
   holder.appendChild(b);
 };
 const addPropertiesButton=()=>{
   if(propertiesAdded)return;propertiesAdded=true;
   const b=document.createElement('button');b.type='button';b.textContent='عقارات';b.title='قسم العقارات';
   b.onclick=()=>showPropertiesWindow();
   holder.appendChild(b);
 };
 menuItems.forEach((item,i)=>{
   const b=document.createElement('button');b.type='button';b.textContent=item.label;b.title=item.label;
   if(i===0)b.classList.add('active');
   b.onclick=()=>{
     if(item.target==='properties'){showPropertiesWindow();return}
     if(item.target==='home'||item.target==='about'||item.target==='services'||item.target==='works'||item.target==='consult'||item.target==='contact'){
       const target=document.getElementById(item.target);
       if(target){if(item.target==='home')window.scrollTo({top:0,behavior:'smooth'});else target.scrollIntoView({behavior:'smooth',block:'center'});return}
     }
     openModal(item.label,'قسم '+item.label+' من القائمة الرئيسية. يمكن تخصيص محتوى هذا القسم لاحقًا.');
   };
   holder.appendChild(b);
   // Add "موقعنا" and "عقارات" beside "تواصل معنا" in the top navigation.
   if(item.label==='تواصل معنا'||item.target==='contact'){addLocationButton();addPropertiesButton();}
 });
 if(!locationAdded)addLocationButton();
 if(!propertiesAdded)addPropertiesButton();
}
function renderProperties(){
 const grid=document.getElementById('propertiesGrid');if(!grid)return;grid.innerHTML='';
 if(!properties.length){grid.innerHTML='<div class="no-properties" style="grid-column:1/-1">أهلاً بك في قسم العقارات<br>لا توجد إعلانات عقارية حاليًا.</div>';return}
 properties.forEach((p,i)=>{
  const imgs=(Array.isArray(p.images)&&p.images.length)?p.images:[p.image].filter(Boolean);
  const card=document.createElement('article');card.className='property-card';card.tabIndex=0;
  card.innerHTML=`<img src="${imgs[0]||''}" alt="${esc(p.title)}"><div class="property-info"><span style="display:inline-block;background:${p.kind==='شراء'?'#e8f6ed':'#eaf2ff'};color:${p.kind==='شراء'?'#19713a':'#064486'};border-radius:6px;padding:3px 8px;font-size:12px;margin-bottom:7px">${p.kind==='شراء'?'مطلوب للشراء':'عقار للبيع'}</span><h3>${esc(p.title)}</h3><p>${esc(p.description).slice(0,130)}${p.description.length>130?'…':''}</p>${p.price?`<div class="property-price">السعر: ${esc(p.price)}</div>`:'<div class="property-price">السعر: عند التواصل</div>'}</div>`;
  const open=()=>showProperty(i);card.onclick=open;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};grid.appendChild(card)
 })
}
function showPropertiesWindow(){
 renderProperties();
 modalTitle.textContent='أهلاً بك في قسم العقارات';
 modalBody.innerHTML=`<p style="font-size:18px;color:#064486;font-weight:bold;text-align:center">أهلاً بك في قسم العقارات</p><p style="text-align:center">تصفح العقارات المعروضة للبيع أو العقارات المطلوبة للشراء.</p><div id="modalPropertiesGrid" class="properties-grid"></div>`;
 const grid=document.getElementById('modalPropertiesGrid');
 if(!properties.length){grid.innerHTML='<div class="no-properties" style="grid-column:1/-1">لا توجد إعلانات عقارية حاليًا.</div>'}
 else properties.forEach((p,i)=>{
  const imgs=(Array.isArray(p.images)&&p.images.length)?p.images:[p.image].filter(Boolean);
  const card=document.createElement('article');card.className='property-card';card.tabIndex=0;
  card.innerHTML=`<img src="${imgs[0]||''}" alt="${esc(p.title)}"><div class="property-info"><span style="display:inline-block;background:${p.kind==='شراء'?'#e8f6ed':'#eaf2ff'};color:${p.kind==='شراء'?'#19713a':'#064486'};border-radius:6px;padding:3px 8px;font-size:12px;margin-bottom:7px">${p.kind==='شراء'?'مطلوب للشراء':'عقار للبيع'}</span><h3>${esc(p.title)}</h3><p>${esc(p.description).slice(0,100)}${p.description.length>100?'…':''}</p>${p.price?`<div class="property-price">السعر: ${esc(p.price)}</div>`:'<div class="property-price">السعر: عند التواصل</div>'}</div>`;
  card.onclick=()=>showProperty(i);card.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();showProperty(i)}};grid.appendChild(card)
 });
 modalBg.classList.add('open');document.body.style.overflow='hidden';
}
function showProperty(i){
 const p=properties[i];if(!p)return;
 const imgs=(Array.isArray(p.images)&&p.images.length)?p.images:[p.image].filter(Boolean);
 modalTitle.textContent=p.title;
 modalBody.innerHTML=`<div id="propertyGallery"><img id="propertyMainImage" src="${imgs[0]||''}" alt="${esc(p.title)}" style="width:100%;max-height:330px;object-fit:contain;background:#f3f6fa;border-radius:8px">${imgs.length>1?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${imgs.map((im,n)=>`<button type="button" class="action secondary" data-image-index="${n}" style="padding:3px;border:2px solid transparent"><img src="${im}" alt="صورة ${n+1}" style="width:65px;height:55px;object-fit:cover;border-radius:5px"></button>`).join('')}</div>`:''}</div><p style="margin-top:12px"><b>${p.kind==='شراء'?'مطلوب للشراء':'عقار للبيع'}</b></p><p style="white-space:pre-wrap">${esc(p.description)}</p>${p.price?`<p><b>السعر:</b> ${esc(p.price)}</p>`:''}<p><b>رقم التواصل:</b> <span dir="ltr">${esc(p.phone)}</span></p><button class="action" id="buyProperty">${p.kind==='شراء'?'التواصل عبر واتساب بخصوص الطلب':'شراء / تواصل عبر واتساب'}</button>`;
 modalBg.classList.add('open');document.body.style.overflow='hidden';
 modalBody.querySelectorAll('[data-image-index]').forEach(btn=>btn.onclick=()=>{document.getElementById('propertyMainImage').src=imgs[Number(btn.dataset.imageIndex)]});
 document.getElementById('buyProperty').onclick=()=>{const phone=String(p.phone||'').replace(/\D/g,'');const message=encodeURIComponent(`السلام عليكم، أرغب بالاستفسار بخصوص: ${p.title} (${p.kind==='شراء'?'طلب شراء عقار':'عقار للبيع'})${p.price?'، السعر: '+p.price:''}`);if(!phone){alert('أضف رقم تواصل صحيحًا للعقار من لوحة التحكم.');return}window.open('https://wa.me/'+phone+'?text='+message,'_blank','noopener')}
}
function renderAdmin(tab='properties'){activeTab=tab;adminTitle.textContent='لوحة تحكم أبو أمجد';let body=`<div class="admin-tabs"><button data-tab="properties" class="${tab==='properties'?'active':''}">إدارة العقارات</button><button data-tab="requests" class="${tab==='requests'?'active':''}">طلبات الاستشارة (${consultationRequests.length})</button><button data-tab="menu" class="${tab==='menu'?'active':''}">القائمة الرئيسية</button><button data-tab="users" class="${tab==='users'?'active':''}">المستخدمون وكلمات المرور</button><button data-tab="account" class="${tab==='account'?'active':''}">تغيير بيانات الدخول</button></div>`;
if(tab==='properties'){body+=`<h3>إضافة إعلان عقاري</h3><form id="propertyForm" class="admin-form"><select name="kind" required><option value="بيع">عقار للبيع</option><option value="شراء">عقار مطلوب للشراء</option></select><input name="title" placeholder="عنوان الإعلان / اسم العقار" required><textarea name="description" placeholder="المواصفات، الموقع، المساحة، عدد الغرف..." required></textarea><input name="price" placeholder="السعر (اختياري)"><input name="phone" type="tel" placeholder="رقم واتساب مع مفتاح الدولة، مثال 9677xxxxxxxx" required><label>صور العقار (يمكن اختيار عدة صور) <input name="images" type="file" accept="image/*" multiple required></label><button class="action">نشر الإعلان</button></form><div class="admin-list"><h3>الإعلانات الحالية (${properties.length})</h3>${properties.map((p,i)=>`<div class="admin-row"><span>${p.kind==='شراء'?'مطلوب للشراء':'للبيع'} — ${esc(p.title)}${p.price?' — '+esc(p.price):''}</span><button data-delete-property="${i}">حذف</button></div>`).join('')||'<p>لا توجد إعلانات.</p>'}</div>`}
if(tab==='requests'){body+=`<h3>طلبات الاستشارة الواردة (${consultationRequests.length})</h3><p class="admin-note">تظهر هنا الطلبات المحفوظة في هذا المتصفح/الجهاز فقط.</p><div class="admin-list">${consultationRequests.map((r,i)=>`<div class="admin-row" style="display:block;padding:12px;margin-bottom:10px"><b>${esc(r.name)}</b> — ${esc(r.date)}<p>الجوال: ${esc(r.phone)}<br>الخدمة: ${esc(r.service)}<br>التفاصيل: ${esc(r.details)}</p><button data-send-request="${i}">إعادة الإرسال إلى واتساب</button> <button data-delete-request="${i}">حذف الطلب</button></div>`).join('')||'<p>لا توجد طلبات محفوظة.</p>'}</div>`}
if(tab==='menu'){body+=`<h3>إضافة خيار للقائمة الرئيسية</h3><form id="menuForm" class="admin-form"><input name="label" placeholder="اسم الخيار الجديد" required><select name="target"><option value="properties">قسم العقارات</option><option value="home">الرئيسية</option><option value="about">عن المكتب</option><option value="services">خدماتنا</option><option value="works">أعمالنا</option><option value="consult">الاستشارات</option><option value="contact">تواصل معنا</option><option value="custom">قسم مخصص (نافذة)</option></select><button class="action">إضافة الخيار</button></form><div class="admin-list"><h3>خيارات القائمة الحالية</h3>${menuItems.map((m,i)=>`<div class="admin-row"><span>${esc(m.label)}</span><button data-delete-menu="${i}">حذف</button></div>`).join('')||'<p>القائمة فارغة.</p>'}</div><p class="admin-note">تُحدَّث القائمة الظاهرة فوق الصورة. حذف الخيار يزيله من القائمة التفاعلية.</p>`}
if(tab==='users'){body+=`<h3>إضافة مستخدم جديد</h3><form id="userForm" class="admin-form"><input name="username" placeholder="اسم المستخدم الجديد" required><input name="password" placeholder="كلمة المرور الجديدة" required><button class="action">إضافة المستخدم</button></form><div class="admin-list"><h3>المستخدمون الحاليون</h3>${users.map((u,i)=>`<div class="admin-row"><span>${esc(u.username)}</span><button data-delete-user="${i}" ${users.length===1?'disabled title="لا يمكن حذف آخر مستخدم"':''}>حذف</button></div>`).join('')}</div>`}
if(tab==='account'){body+=`<h3>تعديل اسم المستخدم وكلمة المرور</h3><form id="accountForm" class="admin-form"><input name="oldUsername" placeholder="اسم المستخدم الحالي" required><input name="oldPassword" type="password" placeholder="كلمة المرور الحالية" required><input name="newUsername" placeholder="اسم المستخدم الجديد" required><input name="newPassword" type="password" placeholder="كلمة المرور الجديدة" required><button class="action">حفظ بيانات الدخول</button></form><p class="admin-note">يمكنك أيضًا إضافة أو حذف مستخدمين من تبويب المستخدمين.</p>`}
body+='<p class="admin-note">تنبيه: هذه نسخة HTML تحفظ البيانات على نفس المتصفح والجهاز فقط. لحماية حقيقية ومشاركة التغييرات بين الزوار تحتاج قاعدة بيانات وخادمًا آمنًا.</p><button class="action secondary" id="adminLogout">تسجيل الخروج</button>';
adminBody.innerHTML=body;
adminBody.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>renderAdmin(b.dataset.tab));
document.getElementById('adminLogout').onclick=()=>{loggedIn=false;closeAdmin()};
const pf=document.getElementById('propertyForm');if(pf)pf.onsubmit=async e=>{e.preventDefault();const d=new FormData(pf),files=Array.from(pf.querySelector('input[name="images"]').files||[]);if(!files.length){alert('اختر صورة واحدة على الأقل.');return}try{const images=[];for(const file of files)images.push(await compressImage(file));properties.push({kind:d.get('kind'),title:d.get('title').trim(),description:d.get('description').trim(),price:d.get('price').trim(),phone:d.get('phone').trim(),images,image:images[0]});setStore('abu_properties',properties);renderProperties();renderAdmin('properties');alert('تم نشر الإعلان في قسم العقارات.')}catch(err){alert('تعذر حفظ الصور. جرّب صورًا أقل حجمًا أو عددًا أقل.')}};
adminBody.querySelectorAll('[data-delete-property]').forEach(b=>b.onclick=()=>{if(confirm('هل تريد حذف هذا العقار؟')){properties.splice(Number(b.dataset.deleteProperty),1);setStore('abu_properties',properties);renderProperties();renderAdmin('properties')}});
adminBody.querySelectorAll('[data-send-request]').forEach(b=>b.onclick=()=>{const r=consultationRequests[Number(b.dataset.sendRequest)];if(!r)return;const msg=`طلب استشارة هندسية\\nالاسم: ${r.name}\\nرقم الجوال: ${r.phone}\\nالخدمة: ${r.service}\\nالتفاصيل: ${r.details}\\nتاريخ الطلب: ${r.date}`;window.open('https://wa.me/967735665047?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer')});
adminBody.querySelectorAll('[data-delete-request]').forEach(b=>b.onclick=()=>{if(confirm('هل تريد حذف هذا الطلب؟')){consultationRequests.splice(Number(b.dataset.deleteRequest),1);setStore('abu_consultation_requests',consultationRequests);renderAdmin('requests')}});
const mf=document.getElementById('menuForm');if(mf)mf.onsubmit=e=>{e.preventDefault();const d=new FormData(mf),label=d.get('label').trim();if(menuItems.some(m=>m.label.toLowerCase()===label.toLowerCase())){alert('هذا الخيار موجود بالفعل.');return}menuItems.push({label,target:d.get('target')});setStore('abu_menu_items',menuItems);renderMenu();renderAdmin('menu')};
adminBody.querySelectorAll('[data-delete-menu]').forEach(b=>b.onclick=()=>{menuItems.splice(Number(b.dataset.deleteMenu),1);setStore('abu_menu_items',menuItems);renderMenu();renderAdmin('menu')});
const uf=document.getElementById('userForm');if(uf)uf.onsubmit=e=>{e.preventDefault();const d=new FormData(uf),username=d.get('username').trim();if(users.some(u=>u.username===username)){alert('اسم المستخدم موجود بالفعل.');return}users.push({username,password:d.get('password')});setStore('abu_admin_users',users);renderAdmin('users')};
adminBody.querySelectorAll('[data-delete-user]').forEach(b=>b.onclick=()=>{if(users.length<=1)return;if(confirm('حذف هذا المستخدم؟')){users.splice(Number(b.dataset.deleteUser),1);setStore('abu_admin_users',users);renderAdmin('users')}});
const af=document.getElementById('accountForm');if(af)af.onsubmit=e=>{e.preventDefault();const d=new FormData(af),idx=users.findIndex(u=>u.username===d.get('oldUsername')&&u.password===d.get('oldPassword'));if(idx<0){alert('بيانات الدخول الحالية غير صحيحة.');return}if(users.some((u,i)=>i!==idx&&u.username===d.get('newUsername'))){alert('اسم المستخدم الجديد مستخدم بالفعل.');return}users[idx]={username:d.get('newUsername').trim(),password:d.get('newPassword')};setStore('abu_admin_users',users);alert('تم تحديث بيانات الدخول. استخدم البيانات الجديدة في المرة القادمة.');renderAdmin('account')};
}
function compressImage(file){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/'))return reject();const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(file)})}
renderMenu();renderProperties();
</script>
</body>
